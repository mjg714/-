<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상상(相想) 테스트: 나는 강아지상? 고양이상?</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center p-6 font-sans">

    <h1 class="text-4xl font-black mb-2 text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-pink-500">✨ 나만의 동물상 분석</h1>
    <p class="text-slate-400 mb-8">당신의 얼굴은 강아지상일까요, 고양이상일까요?</p>

    <div id="game-container" class="flex flex-col lg:flex-row gap-8 items-center">
        <div id="webcam-container" class="rounded-3xl overflow-hidden border-8 border-slate-700 shadow-2xl w-[300px] h-[300px] bg-black"></div>
        
        <div id="result-card" class="bg-slate-800 p-8 rounded-3xl shadow-2xl border border-slate-600 w-80 text-center transition-all duration-500">
            <div id="display-area" class="text-8xl mb-4">🔮</div>
            <div id="label-container" class="text-3xl font-black text-white mb-2">대기 중...</div>
            <div id="message" class="text-slate-400">카메라에 얼굴을 가까이 비춰주세요.</div>
        </div>
    </div>

    <button id="startBtn" class="mt-10 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-400 hover:to-purple-500 text-white font-black py-4 px-10 rounded-full transition-all transform hover:scale-105 shadow-xl">
        분석 시작하기
    </button>

    <script type="text/javascript">
        const URL = "https://teachablemachine.withgoogle.com/models/x-6KfNg9Y/";
        let model, webcam, maxPredictions;

        async function init() {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            document.getElementById("startBtn").innerText = "분석 중...";
            model = await tmImage.load(modelURL, metadataURL);
            
            webcam = new tmImage.Webcam(300, 300, true);
            await webcam.setup();
            await webcam.play();
            window.requestAnimationFrame(loop);

            document.getElementById("webcam-container").appendChild(webcam.canvas);
            document.getElementById("startBtn").classList.add("hidden");
        }

        async function loop() {
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            let top = prediction.sort((a, b) => b.probability - a.probability)[0];
            
            const labelContainer = document.getElementById("label-container");
            const displayArea = document.getElementById("display-area");
            const message = document.getElementById("message");
            const resultCard = document.getElementById("result-card");

            if (top.probability > 0.85) {
                if (top.className.toLowerCase().includes("dog")) {
                    displayArea.innerHTML = "🐶";
                    labelContainer.innerText = "강아지상!";
                    message.innerText = "다정하고 따뜻한 강아지상입니다!";
                    resultCard.className = "bg-orange-900/30 p-8 rounded-3xl shadow-2xl border border-orange-500 w-80 text-center transition-all duration-500";
                } else if (top.className.toLowerCase().includes("cat")) {
                    displayArea.innerHTML = "🐱";
                    labelContainer.innerText = "고양이상!";
                    message.innerText = "도도하고 매력적인 고양이상입니다!";
                    resultCard.className = "bg-purple-900/30 p-8 rounded-3xl shadow-2xl border border-purple-500 w-80 text-center transition-all duration-500";
                }
            }
        }

        document.getElementById("startBtn").addEventListener("click", init);
    </script>
</body>
</html>
